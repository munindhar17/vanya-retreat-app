name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Decode the upload keystore from secrets (skipped if not set yet).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Release will be signed with your upload key."
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - release is signed with a debug key (APK installs fine, AAB will NOT be accepted by Play Store)."
          fi

      - name: Build APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VanyaRetreat-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab out/VanyaRetreat-${{ github.run_number }}.aab
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VanyaRetreat-APK
          path: out/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: VanyaRetreat-AAB
          path: out/*.aab
